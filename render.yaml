services:
  - type: web
    name: registration-form-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: registration-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: registration-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: registration-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: registration-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: registration-db
          property: password

databases:
  - name: registration-db
    plan: free
    databaseName: registration_db
    user: registration_user
