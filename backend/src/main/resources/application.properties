
spring.application.name=registration-api
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:registration_db}}
spring.datasource.username=${DB_USERNAME:postgres12}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
